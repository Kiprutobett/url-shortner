[package]
name = "url-shortner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.0", features = ["std"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
httpc-test = "0.1.10"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
rand = "0.10.2"
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres","runtime-tokio","macros","uuid","chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
